<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DA6FF"/>
      <stop offset="100%" stop-color="#2673CC"/>
    </linearGradient>
    <linearGradient id="mtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EAD5A"/>
      <stop offset="100%" stop-color="#1A7A3A"/>
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>

  <!-- Sun / glow -->
  <circle cx="110" cy="60" r="18" fill="#FFE55C" opacity="0.9"/>
  <circle cx="110" cy="60" r="24" fill="#FFE55C" opacity="0.2"/>

  <!-- Mountains -->
  <polygon points="12,130 60,52 95,100" fill="#1E8B40" opacity="0.6"/>
  <polygon points="75,125 130,38 188,115" fill="#1A7A3A" opacity="0.8"/>

  <!-- Fairy star - the defining symbol of 仙女湖 -->
  <g transform="translate(130,42)" fill="#FFD700">
    <polygon points="0,-14 3.5,-4.5 14,-4.5 5.5,1 8,11 0,5.5 -8,11 -5.5,1 -14,-4.5 -3.5,-4.5"/>
  </g>
  <!-- Small sparkle stars -->
  <g transform="translate(90,32)" fill="#FFD700" opacity="0.7">
    <polygon points="0,-6 1.5,-2 6,-2 2.4,0.5 3.5,5 0,2.5 -3.5,5 -2.4,0.5 -6,-2 -1.5,-2"/>
  </g>

  <!-- Lake water -->
  <path d="M0,135 Q25,127 50,135 Q75,143 100,135 Q125,127 150,135 Q175,143 200,135 L200,200 L0,200 Z" fill="#fff" opacity="0.25"/>
  <path d="M0,148 Q20,141 40,148 Q60,155 80,148 Q100,141 120,148 Q140,155 160,148 Q180,141 200,148 L200,200 L0,200 Z" fill="#fff" opacity="0.18"/>
  <path d="M0,162 Q30,155 60,162 Q90,169 120,162 Q150,155 180,162 L180,200 L0,200 Z" fill="#fff" opacity="0.1"/>

  <!-- "仙" character hint at center - simplified fairy silhouette -->
  <g transform="translate(100,88)" fill="#fff" opacity="0.9">
    <!-- Fairy body -->
    <circle cx="0" cy="-18" r="7" fill="#fff"/>
    <!-- Dress in chevron shape -->
    <polygon points="0,-10 -14,20 14,20" fill="#fff" opacity="0.85"/>
    <!-- Wing/halo on left -->
    <ellipse cx="-16" cy="-5" rx="8" ry="14" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="16" cy="-5" rx="8" ry="14" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
